name: Node.js CI

on:
  push:
    branches: [ "main", "nurettin-branch" ]
  pull_request:
    branches: [ "main" ]

jobs:
  build:
    runs-on: ubuntu-latest

    strategy:
      matrix:
        node-version: [18.x, 20.x, 22.x]

    steps:
      - uses: actions/checkout@v4
      - name: Use Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
          cache: 'npm'
      - run: npm ci
      - name: Syntax check critical files
        shell: bash
        run: |
          node --check app.js
          node --check routes/historyRoutes.js
          node --input-type=module --check < public/homeDataLoader.js
          node --input-type=module --check < public/historyDataLoader.js
          node --input-type=module --check < public/scrapeClientParser.js
      - run: npm run build --if-present
      - run: npm test -- --runInBand

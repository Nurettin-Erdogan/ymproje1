name: Node.js CI

on:
  push:
    branches: [ "main", "nurettin-branch" ]
  pull_request:
    branches: [ "main" ]

jobs:
  build:
    runs-on: ubuntu-latest

    strategy:
      matrix:
        node-version: [18.x, 20.x, 22.x]

    steps:
      - uses: actions/checkout@v4
      - name: Use Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
          cache: 'npm'
      - run: npm ci
      - name: Syntax check critical files
        shell: bash
        run: |
          node --check app.js
          node --check routes/historyRoutes.js
          node --input-type=module --check < public/homeDataLoader.js
          node --input-type=module --check < public/historyDataLoader.js
          node --input-type=module --check < public/scrapeClientParser.js
      - run: npm run build --if-present
      - run: npm test -- --runInBand
      - name: HTTP smoke test
        shell: bash
        env:
          PORT: "3101"
          SESSION_SECRET: "ci-only-session-secret"
        run: |
          node app.js > /tmp/ymproje1-app.log 2>&1 &
          APP_PID=$!
          trap 'kill "$APP_PID" 2>/dev/null || true' EXIT

          READY=0
          for i in {1..20}; do
            if curl --fail --silent http://127.0.0.1:3101/ > /tmp/home.html; then
              READY=1
              break
            fi
            sleep 0.5
          done

          if [ "$READY" -ne 1 ]; then
            cat /tmp/ymproje1-app.log
            exit 1
          fi

          grep -q "Kur Grafiği" /tmp/home.html
          curl --fail --silent http://127.0.0.1:3101/auth/me | grep -q '"user":null'

          STATUS=$(curl --silent --output /tmp/history-invalid.json --write-out '%{http_code}' \
            'http://127.0.0.1:3101/api/history/banks?start=bad&end=2026-09-17&pair=USD%2FTRY')
          test "$STATUS" = "400"

      - name: Live bank-history smoke test
        if: matrix.node-version == '22.x'
        continue-on-error: true
        shell: bash
        env:
          PORT: "3102"
          SESSION_SECRET: "ci-only-session-secret"
        run: |
          node app.js > /tmp/ymproje1-live.log 2>&1 &
          APP_PID=$!
          trap 'kill "$APP_PID" 2>/dev/null || true' EXIT

          for i in {1..20}; do
            curl --fail --silent http://127.0.0.1:3102/ > /dev/null && break
            sleep 0.5
          done

          curl --fail --silent --max-time 60 \
            'http://127.0.0.1:3102/api/history/banks?start=2026-09-01&end=2026-09-17&pair=USD%2FTRY' \
            > /tmp/history-live.json

          node -e "const fs=require('fs'); const p=JSON.parse(fs.readFileSync('/tmp/history-live.json','utf8')); if(!Array.isArray(p.series)||p.series.length!==3) process.exit(1); const names=p.series.map(x=>x.name); const counts=p.series.map(x=>Array.isArray(x.points)?x.points.length:0); console.log({names,counts}); if(counts.every(x=>x===0)) process.exit(1);"

name: Node.js CI

on:
  push:
    branches: [ "main", "nurettin-branch" ]
  pull_request:
    branches: [ "main" ]

jobs:
  build:
    runs-on: ubuntu-latest

    strategy:
      matrix:
        node-version: [18.x, 20.x, 22.x]

    steps:
      - uses: actions/checkout@v4
      - name: Use Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
          cache: 'npm'
      - run: npm ci
      - name: Syntax check critical files
        shell: bash
        run: |
          node --check app.js
          node --check routes/historyRoutes.js
          node --input-type=module --check < public/homeDataLoader.js
          node --input-type=module --check < public/historyDataLoader.js
          node --input-type=module --check < public/scrapeClientParser.js
      - run: npm run build --if-present
      - run: npm test -- --runInBand
      - name: HTTP smoke test
        shell: bash
        env:
          PORT: "3101"
          SESSION_SECRET: "ci-only-session-secret"
        run: |
          node app.js > /tmp/ymproje1-app.log 2>&1 &
          APP_PID=$!
          trap 'kill "$APP_PID" 2>/dev/null || true' EXIT

          READY=0
          for i in {1..20}; do
            if curl --fail --silent http://127.0.0.1:3101/ > /tmp/home.html; then
              READY=1
              break
            fi
            sleep 0.5
          done

          if [ "$READY" -ne 1 ]; then
            cat /tmp/ymproje1-app.log
            exit 1
          fi

          grep -q "Kur Grafiği" /tmp/home.html
          curl --fail --silent http://127.0.0.1:3101/auth/me | grep -q '"user":null'

          STATUS=$(curl --silent --output /tmp/history-invalid.json --write-out '%{http_code}' \
            'http://127.0.0.1:3101/api/history/banks?start=bad&end=2026-09-17&pair=USD%2FTRY')
          test "$STATUS" = "400"
